name: Feature request
description: Suggest an improvement, new dataset, metric, or tooling change
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Concrete proposals help, but the *need* matters most.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is hard or missing today?
      placeholder: e.g. Hard to compare thresholds under a fixed call-center budget
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Optional sketches or API ideas welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Documentation only
        - One notebook
        - Shared pipeline / tooling
        - New dataset notebook
        - Evaluation / metrics
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints you are aware of
      options:
        - label: Prefer `uv` (no bare pip / ad-hoc venvs)
        - label: Keep train/test leakage discipline and seed reproducibility
        - label: Do not assume TabFM weights are commercially free
        - label: Real metrics in docs should come from real runs
