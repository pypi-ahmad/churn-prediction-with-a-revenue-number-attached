name: Question
description: Ask about setup, methodology, TabFM, RFM labels, or results
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer questions that help future readers. Check the README first for setup and results.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation / environment
        - Modeling methodology
        - TabFM
        - RFM / Online Retail label
        - Metrics / revenue-at-risk interpretation
        - Licensing (code, data, weights)
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you already tried, relevant notebook section, or screenshots of errors (optional).
